# Lessons learned - add insights here for future sessions
lessons_learned:
  - context: "CLI year flags that label output without driving data pulls are silent-mislabel landmines"
    lesson: "scripts/run_full_pipeline.py --year flowed only into the output filename and DB year column; the actual ACS pull was driven by settings.acs_year (from .env). A user with ACS_YEAR=2023 who ran with --year 2024 produced cria_results_county_2024.xlsx containing ACS 2023 data, with no warning. The years sheet inside the file correctly reported acs=2023 — the file was honest about itself, but the filename and CLI arg overwrote that signal at every other surface. Doctrine: any CLI arg that tags an artifact MUST either drive the underlying behavior or refuse divergence by default. A loud opt-in override (--allow-year-mismatch) preserves the rare legitimate cases (back-dated tagging, vintage comparisons) without making the bug the default."
    date: "2026-05-14"
  - context: "Empirical bit-exact validation beats circumstantial reasoning when source data is reproducible"
    lesson: "Diagnosing the sponsor's ACS-year mismatch was strongly suggested by the years sheet, but final confidence came from recomputing: pulling indicators tagged year=2023 from local SQLite and comparing to the sponsor's file produced 0 mismatches with max abs diff = 5.55e-17 (machine epsilon) on 14 of 17 ACS indicators across 3,222 common counties. The 3 imperfect-match indicators (Civil Org, Hospitals, Inactive Voter) all had a clean explanation (CBP-year drift, EAVS coverage drift). Without the bit-exact check, the sponsor could have argued 'well, ACS years are similar but maybe not identical'. With it, the diagnosis is closed. When you can recompute cheaply, do — even when the circumstantial case looks solid."
    date: "2026-05-14"
  - context: "Silent-success failure modes are the worst kind — defense in depth is the answer"
    lesson: "The pipeline previously logged 22 'Indicator not found in database' warnings then reported success while persisting nothing. Three independent guards now close this: startup preflight (5-second DB count check before any pull, saves 60-138min on a setup error), in-method save_to_database fail-fast (catches notebooks/ad-hoc scripts that bypass the script), parquet ImportError surface (silent fallback to API returns stripped geography reference). Doctrine: warn-and-continue on partial misses (data-cleanliness issue), raise on total miss (setup-state issue). No single guard is sufficient — different entry points need different defenses."
    date: "2026-05-06"
  - context: "Drop-log message wording matters disproportionately"
    lesson: "'Dropping 3496 rows with invalid index' (always WARNING, no kept-count, no explanation) was the second most-confusing message in the sponsor's escalation — it looked like a bug but is documented outer-merge housekeeping. Same operation reframed as 'Cleaning merge artifacts: dropped N rows (X%), keeping M valid rows. Outer-merge artifact from per-source pulls...' reads as expected behavior. INFO when drop ratio reasonable, WARNING above threshold (60%) so genuine regression isn't silently demoted. Lesson: a scary-looking log line consumes diagnostic attention even when it's not the actual problem."
    date: "2026-05-06"
  - context: "Census API returns HTTP 200 with non-JSON body for several error classes"
    lesson: "Unknown variables, unknown datasets, and bad keys all come back as HTTP 200 with plain-text or HTML error bodies (e.g. \"error: error: unknown variable 'DP04_0014E'\"). response.raise_for_status() does not catch this, and json.loads then dies with the cryptic 'Expecting value: line 2 column 1' — discarding the actual server message. Always wrap json.loads of API responses with a custom exception that preserves status + content-type + body excerpt."
    date: "2026-05-04"
  - context: "pydantic-settings preserves .env quotes and whitespace literally"
    lesson: "CENSUS_API_KEY=\"abc123\" in .env becomes the literal value \"abc123\" (with quotes) at runtime, silently corrupting the URL. Same for trailing whitespace and line-wrap newlines in long values. Strip these in client __init__ rather than asking users to reformat .env."
    date: "2026-05-04"
  - context: "Census API keys are 40 lowercase-hex characters"
    lesson: "Documented format. Heuristic check (length 40 + hex chars only) catches paste errors and wrong-service keys. Implemented as warning, not enforcement, since Census could theoretically change formats."
    date: "2026-05-04"
  - context: "Test count: pytest collects vs. raw def count"
    lesson: "pytest --collect-only reports 541 tests for the suite; a raw `grep '^def test_'` returns 531. Difference is parametrize expansion (10 tests). README badges and CHANGELOG should report the pytest collection count (541), not the function count. Almost reverted a correct number to a wrong one in 2026-04-30 deep-review pass — saved by PCC running actual pytest."
    date: "2026-04-30"
  - context: "Doc review process: parallel agent reviews work; verification pass is mandatory"
    lesson: "Spawning 4 specialized agents in parallel (cria-analyst/data-engineer/decision-scientist/quality-auditor) for doc review surfaced ~30 distinct findings. But ~30% of agent claims were themselves wrong (test counts, file existence, line numbers). ALWAYS run a verification pass against actual code before acting on agent review findings. Spawning the auditor a second time after fixes caught 9 more real bugs I introduced while fixing the first 8."
    date: "2026-04-30"
  - context: "EAVS -88 code means 'does not apply', not zero"
    lesson: "EAVS survey uses -88 for 'does not apply' and -99 for 'data not available'. Both must map to NaN, not 0. -88→0 created false Inactive Voter values (0/0→0) for non-reporting states. 14 states/territories affected."
    date: "2026-03-25"
  - context: "Indicators tab vs CRCI pipeline need different imputation"
    lesson: "The indicators tab must show true values (NaN for missing data → gray on map). The CRCI pipeline needs imputed values (mean fill). Solution: call _clean_indicators() twice — once with impute=False for display, once with impute=True for aggregation. clean_series() already supports both modes."
    date: "2026-03-25"
  - context: "Zero denominators are undefined, not zero"
    lesson: "All 5 indicator calculation functions had result.loc[denom==0]=0. A zero denominator means the indicator is undefined (NaN), not zero. Changed to np.nan across _divide, _max, _mean, _divide_scalar, _reverse_divide."
    date: "2026-03-25"
  - context: "Connecticut COG restructuring"
    lesson: "CT abolished counties in 2022, creating 9 planning regions (FIPS 09110-09190). CBP data now has 18 CT entries (9 old + 9 new). Old counties get uniform state-level values; new regions get actual data starting CBP 2023."
    date: "2026-02-24"
  - context: "Tract pipeline DB save time"
    lesson: "Saving 88K tract source_data records to PostgreSQL takes ~63 minutes. Full tract pipeline takes ~138 minutes. Set PIPELINE_TIMEOUT_MINUTES=240."
    date: "2026-02-24"
  - context: "Binning auto-select scoring"
    lesson: "Must center-scale (z-score) ADCM+TSS across methods before combining. Raw scores let FisherJenks win every time since it optimizes for ADCM by design."
    date: "2026-02-17"
  - context: "Pytest timeout configuration"
    lesson: "Always configure pytest-timeout (<600s) to prevent runaway tests. 18-day incident on shared server."
    date: "2025-12-22"
  - context: "JenksCaspall binning algorithm"
    lesson: "Can enter infinite loop on degenerate data (many duplicates). Use FisherJenks instead."
    date: "2025-12-05"
  - context: "Database bulk inserts"
    lesson: "Use SQLAlchemy Core insert() with batches, not ORM add_all(). 2000x faster."
    date: "2025-12-03"
  - context: "Census tract data"
    lesson: "Cannot use state wildcard for tract queries. Must iterate over each state."
    date: "2025-12-03"
  - context: "EAVS data"
    lesson: "Returns ZIP file containing CSV, not direct CSV. Extract first."
    date: "2025-12-03"
  - context: "ARDA religion data"
    lesson: "POP column is year-specific (POP2020, POP2010). Add generic POP alias."
    date: "2025-12-03"
  - context: "Connecticut CBP 2022"
    lesson: "Has zero values in CBP data. Convert to NaN for proper handling."
    date: "2025-10-30"
  - context: "Puerto Rico Limited English"
    lesson: "Spanish speakers are not 'limited English'. Exclude from calculation."
    date: "2025-10-30"


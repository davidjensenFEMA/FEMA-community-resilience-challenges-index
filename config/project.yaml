# FEMA CRIA - Central Project Configuration
# This is the single source of truth for project state and metadata.
# Claude commands (session-start, session-end) read and update this file.

project:
  name: FEMA CRIA
  full_name: Community Resilience Indicator Analysis
  description: Data analysis toolkit for collecting, calculating, and aggregating community resilience indicators from government data sources
  version: "1.0.0"
  status: production-ready

# Current focus area
focus:
  area: maintenance
  description: Production ready, bug fixes complete, available for new feature work
  milestone: Phase 8 Complete

# Module registry - where code lives
modules:
  api:
    path: src/api/
    description: External API clients (Census, CBP, EAVS, ARDA, POP)
    files:
      - census_client.py
      - cbp_client.py
      - external_clients.py
      - base_client.py
  core:
    path: src/core/
    description: Main CRIA workflow logic
    files:
      - data_puller.py
      - calculator.py
      - aggregator.py
      - binning.py
  db:
    path: src/db/
    description: Database layer (SQLAlchemy models, repositories)
    files:
      - models.py
      - repositories.py
      - session.py
  config:
    path: src/config/
    description: Runtime configuration (Pydantic settings, paths)
    files:
      - settings.py
      - paths.py
  utils:
    path: src/utils/
    description: Helper utilities
    files:
      - logger.py
      - excel_tools.py

# Directory map
directories:
  config: config/                    # Project config (this file, indicators.yaml)
  src: src/                          # Source code
  tests: tests/                      # Test suite
  scripts: scripts/                  # Production scripts
  docs: docs/                        # Documentation
  docs_design: docs/design/          # Architecture references (database_schema, docker, production_deployment, testing)
  docs_guides: docs/guides/          # User-facing tasks and tutorials (13 guides: generalist + domain + engineering)
  docs_sessions: docs/sessions/      # Session logs
  docs_plans: docs/plans/            # Implementation plans (active CONOPs + historical refactor plans)
  docs_reviews: docs/reviews/        # Agent audit/review reports (YYYYMMDD_<subject>.md)
  changelog: CHANGELOG.md            # Version history (root)
  data: data/                        # Input data files
  output: data/output/               # Generated outputs
  docker: docker/                    # Docker configuration
  alembic: alembic/                  # Database migrations
  deprecated: deprecated/            # Old code


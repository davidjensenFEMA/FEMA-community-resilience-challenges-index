[tool.poetry]
name = "fema-cria"
version = "2.0.0"
description = "Community Resilience Indicator Analysis - Professional OOP Refactor"
authors = ["John Hutchison"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.1.0"
numpy = "^1.26.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.12.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
mapclassify = "^2.6.0"
openpyxl = "^3.1.0"
xlsxwriter = "^3.1.0"
numba = "^0.62.1"
pyarrow = "^14.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-env = "^1.1.0"
black = "^23.12.0"
ruff = "^0.1.0"
mypy = "^1.7.0"
ipdb = "^0.13.13"
pytest-timeout = "^2.4.0"

[tool.poetry.scripts]
cria-county = "scripts.run_county_workflow:main"
cria-tract = "scripts.run_tract_workflow:main"
cria-tribal = "scripts.run_tribal_workflow:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | deprecated
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]
exclude = [
    ".git",
    "__pycache__",
    "deprecated",
    ".venv",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "deprecated",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Timeout: Prevent runaway tests (18-day incident on 2025-12-22)
# Individual tests timeout after 300s (5 min), override with @pytest.mark.timeout(X)
timeout = 300
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Fast unit tests (no external dependencies)",
    "integration: Integration tests (database, API calls)",
    "slow: Tests that take > 10 seconds",
    "requires_db: Tests that require database connection",
    "requires_api: Tests that require external API calls",
]
env = [
    "TEST_MODE=True",
    "LOG_LEVEL=DEBUG",
]

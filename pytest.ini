# Pytest Configuration for FEMA CRIA

[pytest]
# Timeout: Prevent runaway tests (18-day incident on 2025-12-22)
# Individual tests timeout after 300s (5 min), override with @pytest.mark.timeout(X)
timeout = 300

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers (use @pytest.mark.<marker>)
markers =
    unit: Fast unit tests (no external dependencies)
    integration: Integration tests (database, API calls)
    slow: Tests that take > 10 seconds
    requires_db: Tests that require database connection
    requires_api: Tests that require external API calls
    requires_docker: Tests that require Docker
    smoke: Thin end-to-end pipeline sanity checks (mocked APIs, fast)
    calibration: Baseline regression tests (run on-demand: pytest -m calibration)

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --color=yes
    -ra

# Coverage options (when using --cov)
# Run with: pytest --cov=src --cov-report=html
[coverage:run]
source = src
omit =
    */tests/*
    */deprecated/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
